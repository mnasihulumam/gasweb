<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GasWeb — Website Profesional. Bisnis Makin Gas.</title>
  <meta name="description" content="GasWeb membantu bisnis, UMKM, dan profesional memiliki website modern yang siap menjadi wajah digital bisnis Anda.">
  <meta name="theme-color" content="#FF5A1F">

  <!-- Open Graph -->
  <meta property="og:title" content="GasWeb — Website Profesional. Bisnis Makin Gas.">
  <meta property="og:description" content="Kami bantu bisnis, UMKM, dan profesional memiliki website modern yang siap menjadi wajah digital bisnis Anda.">
  <meta property="og:type" content="website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0F1F3D;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading screen */
    #loader {
      position: fixed;
      inset: 0;
      background: #0F1F3D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.1s ease, visibility 0.1s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 90, 31, 0.25);
      border-top-color: #FF5A1F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      margin-top: 16px;
      color: rgba(255, 255, 255, 0.7);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Memuat GasWeb...</div>
  </div>

  <!-- Embed Google Apps Script Web App -->
  <iframe
    id="gasweb-frame"
    src="https://script.google.com/macros/s/AKfycby68PkyXVAPshJn9W13iWJEWSUu2yiUtE5R96M3AyV148QX52Vhp7BuwIHsepzPHko1ow/exec"
    title="GasWeb"
    allow="clipboard-write"
    loading="eager"
  ></iframe>

  <script>
    const iframe = document.getElementById('gasweb-frame');
    const loader = document.getElementById('loader');

    // Sembunyikan loader setelah iframe load
    iframe.addEventListener('load', function () {
      setTimeout(function () {
        loader.classList.add('hide');
      }, 300);
    });

    // Fallback: sembunyikan loader setelah 4 detik kalau load event gagal
    setTimeout(function () {
      loader.classList.add('hide');
    }, 4000);
  </script>

</body>
</html>
